spring.application.name=patient-booking
server.port=8080

# --- MySQL (override with environment variables if needed) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Schema is created by database/schema.sql, so Hibernate does not touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# --- JWT ---
app.jwt.secret=${JWT_SECRET:aG9zcGl0YWwtYm9va2luZy1kZXYtb25seS1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
app.jwt.expiration-ms=86400000

# --- CORS (Next.js dev server) ---
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}
